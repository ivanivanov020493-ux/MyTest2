<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1С live screen</title>
<style>
html,body{margin:0;background:#111;color:#fff;font:16px system-ui;text-align:center}
#status{margin:12px}
#screen{display:block;width:min(1440px,100vw);height:auto;margin:auto;background:#111}
</style>
<p id="status">Загрузка первого кадра…</p>
<img id="screen" alt="Экран 1С">
<script>
const base='https://res.cloudinary.com/elgvc1ah/image/upload/live-frame-test-png.png';
const screen=document.getElementById('screen');
const status=document.getElementById('status');
let requests=0;
let timer=null;
function schedule(ms=3000){clearTimeout(timer);timer=setTimeout(refresh,ms)}
function refresh(){
  requests++;
  const url=base+'?t='+Date.now();
  const next=new Image();
  next.onload=()=>{screen.src=url;status.textContent='Обновлено: '+new Date().toLocaleTimeString()+' · кадр '+requests;schedule(3000)};
  next.onerror=()=>{status.textContent='Ошибка загрузки · попытка '+requests+' · предыдущий кадр сохранён';schedule(3000)};
  next.src=url;
}
refresh();
</script>
</html>
