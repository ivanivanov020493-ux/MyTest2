<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live test</title><style>body{font-family:system-ui;margin:24px;background:#111;color:#eee}#box{white-space:pre-wrap;font-size:24px;padding:20px;border:1px solid #555;border-radius:12px}</style><h1>GitHub Pages live test</h1><div id="box">Загрузка…</div><script>const url='https://raw.githubusercontent.com/ivanivanov020493-ux/MyTest2/main/test.txt';async function load(){try{const r=await fetch(url+'?t='+Date.now(),{cache:'no-store'});document.getElementById('box').textContent=await r.text()}catch(e){document.getElementById('box').textContent='Ошибка: '+e}}load();setInterval(load,1000);</script></html>
