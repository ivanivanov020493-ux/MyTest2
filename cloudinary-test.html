<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Трансляция экрана 1С</title>
<style>
html,body{margin:0;min-height:100%;background:#111;color:#fff;font:16px system-ui;text-align:center}
#status{margin:10px}
#screen{display:block;max-width:100vw;max-height:calc(100vh - 48px);width:auto;height:auto;margin:0 auto;background:#111;object-fit:contain}
</style>
<p id="status">1С LIVE · PNG 1440×900 через Cloudinary · обновление раз в 3 секунды</p>
<img id="screen" src="https://res.cloudinary.com/elgvc1ah/image/upload/live-frame.png?t=0" alt="Экран 1С">
<script>
const base = "https://res.cloudinary.com/elgvc1ah/image/upload/live-frame.png";
const screen = document.getElementById("screen");
function refresh() {
  const next = new Image();
  next.onload = () => { screen.src = next.src; };
  next.src = base + "?t=" + Date.now();
}
setInterval(refresh, 3000);
refresh();
</script>
</html>
