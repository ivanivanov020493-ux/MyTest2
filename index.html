<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitHub SHA live test</title>
<style>
body{font-family:system-ui;margin:24px;background:#111;color:#eee}
#box,#status,#events{white-space:pre-wrap;padding:16px;border:1px solid #555;border-radius:12px;margin:12px 0}
#box{font-size:24px} #status{color:#9fe} #events{font-family:ui-monospace,monospace;font-size:13px}
</style>
</head>
<body>
<h1>GitHub Pages → commit SHA → raw file</h1>
<div id="box">Загрузка…</div>
<div id="status">Запуск…</div>
<div id="events"></div>
<script>
const owner='ivanivanov020493-ux';
const repo='MyTest2';
const file='test.txt';
const intervalMs=2000;
let lastSha='';
let timer;
const events=[];
function showEvent(message){
  events.unshift(new Date().toISOString()+' '+message);
  document.getElementById('events').textContent=events.slice(0,20).join('\n');
}
async function poll(){
  const started=Date.now();
  try{
    const api='https://api.github.com/repos/'+owner+'/'+repo+'/commits/main';
    const r=await fetch(api,{cache:'no-store'});
    const remaining=r.headers.get('x-ratelimit-remaining');
    const limit=r.headers.get('x-ratelimit-limit');
    const reset=r.headers.get('x-ratelimit-reset');
    if(!r.ok) throw new Error('GitHub API '+r.status+'; remaining='+remaining);
    const commit=await r.json();
    if(commit.sha!==lastSha){
      const raw='https://raw.githubusercontent.com/'+owner+'/'+repo+'/'+commit.sha+'/'+file;
      const f=await fetch(raw,{cache:'no-store'});
      if(!f.ok) throw new Error('raw '+f.status);
      const text=await f.text();
      document.getElementById('box').textContent=text;
      lastSha=commit.sha;
      showEvent('SHA '+commit.sha.slice(0,12)+'; файл обновлён');
    }
    document.getElementById('status').textContent=
      'poll='+intervalMs+' ms | SHA='+lastSha.slice(0,12)+
      ' | API '+remaining+'/'+limit+
      ' | reset='+reset+
      ' | запрос '+(Date.now()-started)+' ms';
  }catch(e){
    document.getElementById('status').textContent='Ошибка: '+e.message;
    showEvent('ОШИБКА '+e.message);
  }finally{
    timer=setTimeout(poll,intervalMs);
  }
}
poll();
</script>
</body>
</html>
